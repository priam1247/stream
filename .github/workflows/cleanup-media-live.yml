name: Temporary remaining media smoke tests
on:
  push:
    branches: [arena/ab3c13e0-stream]
    paths: ['.github/workflows/cleanup-media-live.yml']
permissions:
  contents: read
jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [song, video, dl-audio, title]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bot dependencies
        working-directory: Whatsapp bot
        run: npm ci --no-audit --no-fund
      - name: Run actual command and fully decode delivered media
        working-directory: Whatsapp bot
        env:
          KNIGHT_LIVE: '1'
        run: node scripts/test-knight-live.js '${{ matrix.mode }}'
