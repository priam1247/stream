name: Deploy bot to XS Systems panel

# Pterodactyl-style panels (XS Systems included) have no GitHub integration:
# no webhook, no git in the File Manager, and the console is the bot's stdin —
# typing "git pull" there does nothing. So:
#   1. `selftest` runs the bot tests in `Whatsapp bot/` and builds `dashboard/`.
#   2. Pushes never upload to the retired panel. A manually dispatched run from
#      main requires explicit confirmation before any legacy SFTP upload.
#      Botkeep is updated separately by the owner.
#
#   Repo → Settings → Secrets and variables → Actions
#   secrets:  PANEL_SFTP_HOST  PANEL_SFTP_PORT  PANEL_SFTP_USER
#             PANEL_SFTP_PASS or PANEL_SSH_KEY, plus optional PANEL_API_KEY
#   vars:     PANEL_URL  PANEL_SERVER_ID  (enables automatic HTTPS restart)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_legacy_sftp:
        description: 'I verified the legacy SFTP destination and explicitly want to upload there'
        type: boolean
        required: true
        default: false

# A newer dashboard run must not cancel an in-progress bot upload.
concurrency:
  group: panel-deploy-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  selftest:
    name: Selftest & Dashboard Build Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            Whatsapp bot/package-lock.json
            dashboard/package-lock.json

      - name: Test bot deployment safeguards
        run: node --test .github/tests/deploy-bot-gate.test.cjs

      - name: Install bot dependencies
        working-directory: Whatsapp bot
        run: npm ci

      - name: Bot offline selftest
        working-directory: Whatsapp bot
        run: npm run selftest

      - name: Media regression tests
        working-directory: Whatsapp bot
        run: npm run test:media

      - name: Background job tests
        working-directory: Whatsapp bot
        run: npm run test:jobs

      - name: Session and routing tests
        working-directory: Whatsapp bot
        run: npm run test:sessions

      - name: Offline provider URL recognition
        working-directory: Whatsapp bot
        run: |
          python3 -m venv "$RUNNER_TEMP/yt-extractors"
          "$RUNNER_TEMP/yt-extractors/bin/python" -m pip install 'yt-dlp==2026.10.26'
          "$RUNNER_TEMP/yt-extractors/bin/python" scripts/test-media-extractors.py

      - name: One-time live provider search diagnostic
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 4
        working-directory: Whatsapp bot
        run: |
          PATH="$RUNNER_TEMP/yt-extractors/bin:$PATH" node - <<'NODE'
          const axios = require('axios');
          const { JSDOM } = require('jsdom');
          const search = require('./utils/providerSearch');
          (async () => {
            let brave;
            try {
              const response = await axios.get('https://search.brave.com/search', {
                params: { q: 'cat site:douyin.com/video', source: 'web' },
                timeout: 10000, maxRedirects: 0, responseType: 'text',
                headers: { 'User-Agent': 'Mozilla/5.0' },
              });
              const doc = new JSDOM(response.data).window.document;
              brave = {
                status: response.status, bytes: response.data.length,
                snippet: doc.querySelectorAll('.snippet').length,
                headers: doc.querySelectorAll('a.result-header').length,
                results: doc.querySelectorAll('#results a[href], #web-results a[href]').length,
                parsed: search.normalizeRows('douyin', search.parseBrave(response.data), 5).length,
              };
            } catch (err) { brave = { error: err.response?.status || err.code || err.message }; }
            let firecrawl;
            try {
              const response = await axios.post('https://api.firecrawl.dev/v2/search', {
                query: 'cat', includeDomains: ['douyin.com'], limit: 6, sources: ['web'], timeout: 9000,
              }, { timeout: 10000, maxRedirects: 0 });
              firecrawl = { status: response.status, success: response.data?.success,
                returned: response.data?.data?.web?.length,
                valid: search.normalizeRows('douyin', response.data?.data?.web || [], 5).length };
            } catch (err) { firecrawl = { error: err.response?.status || err.code || err.message }; }
            const sites = [];
            for (const site of ['vimeo', 'twitch', 'vk', 'xiaohongshu']) {
              const found = await search.searchProvider(site, 'cat', { limit: 3 });
              sites.push({ site, status: found.status, source: found.source, count: found.results.length });
            }
            console.log('::notice title=Live search diagnostic::' + JSON.stringify({ brave, firecrawl, sites }));
          })().catch((err) => { console.error(err.message); process.exitCode = 1; });
          NODE

      - name: Live HLS downloader smoke test
        working-directory: Whatsapp bot
        run: node scripts/test-nm3u8dl-live.js

      - name: Verify standalone dashboard typecheck & build
        working-directory: dashboard
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

  bot_changes:
    name: Check for bot changes
    needs: selftest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.bot_changes.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check whether the bot needs an upload
        id: bot_changes
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/should-deploy-bot.sh

  deploy:
    name: Upload to panel over SFTP
    needs: bot_changes
    # Botkeep is updated manually. Never send bot changes to the old panel on a push.
    if: needs.bot_changes.outputs.deploy == 'true' && github.event_name == 'workflow_dispatch' && inputs.confirm_legacy_sftp == true
    # Only actual uploads enter this queue. Do not interrupt an upload in flight.
    concurrency:
      group: panel-bot-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify the tested bot is current
        id: freshness
        run: bash .github/scripts/check-bot-freshness.sh

      - name: Are the panel secrets configured?
        id: cfg
        if: steps.freshness.outputs.fresh == 'true'
        env:
          H: ${{ secrets.PANEL_SFTP_HOST }}
          U: ${{ secrets.PANEL_SFTP_USER }}
          P: ${{ secrets.PANEL_SFTP_PASS }}
          K: ${{ secrets.PANEL_SSH_KEY }}
        run: bash .github/scripts/check-panel-config.sh

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Whatsapp bot/package-lock.json

      - name: Pre-upload selftest gate
        if: steps.cfg.outputs.ready == 'true'
        working-directory: Whatsapp bot
        run: npm ci && npm run selftest

      - name: Install lftp
        if: steps.cfg.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Upload a clean archive of the committed bot subtree, not the whole repo
      # or runtime files created by tests. No --delete: existing server state
      # (session, .env, database, etc.) must never be removed or overwritten.
      - name: Upload the bot
        if: steps.cfg.outputs.ready == 'true'
        working-directory: Whatsapp bot
        env:
          SFTP_HOST: ${{ secrets.PANEL_SFTP_HOST }}
          SFTP_PORT: ${{ secrets.PANEL_SFTP_PORT || '2022' }}
          SFTP_USER: ${{ secrets.PANEL_SFTP_USER }}
          SFTP_PASS: ${{ secrets.PANEL_SFTP_PASS }}
          SSH_KEY: ${{ secrets.PANEL_SSH_KEY }}
        run: |
          set -euo pipefail
          STAGING_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/zafar-bot.XXXXXX")
          trap 'rm -rf "$STAGING_DIR"' EXIT
          git archive 'HEAD:Whatsapp bot' | tar -x -C "$STAGING_DIR"
          cd "$STAGING_DIR"
          EXCLUDES=(
            --exclude-glob .git/
            --exclude-glob node_modules/
            --exclude-glob bin/
            --exclude-glob session/
            --exclude-glob '*.session/'
            --exclude-glob temp/
            --exclude-glob tmp/
            --exclude-glob data/
            --exclude-glob secrets/
            --exclude-glob cookies/
            --exclude-glob database/
            --exclude-glob .env
            --exclude-glob .env.local
            --exclude-glob .env.production
            --exclude-glob '*.log'
            --exclude-glob '*cookies*.txt'
            --exclude-glob '*.wvd'
            --exclude-glob '*.arl'
            --exclude-glob 'database/*.json'
            --exclude-glob 'database/*.bak'
            --exclude-glob 'database/*.corrupt*'
            --exclude-glob 'database/*.tmp'
            --exclude-glob 'database/*.sqlite*'
          )

          if [ -n "$SSH_KEY" ]; then
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_panel
            chmod 600 ~/.ssh/id_panel
            trap 'rm -f "$HOME/.ssh/id_panel"; rm -rf "$STAGING_DIR"' EXIT
            lftp -c "
              set sftp:auto-confirm yes;
              set sftp:connect-program \"ssh -a -x -i $HOME/.ssh/id_panel -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new\";
              set net:timeout 25;
              set net:max-retries 3;
              set net:reconnect-interval-base 5;
              open -u \"$SFTP_USER\",DUMMY sftp://$SFTP_HOST:${SFTP_PORT:-2022};
              mirror -R --verbose --no-perms --parallel=4 ${EXCLUDES[*]} ./ /;
              bye
            "
          else
            SAFE_PASS=${SFTP_PASS//\\/\\\\}
            SAFE_PASS=${SAFE_PASS//\"/\\\"}
            lftp -c "
              set sftp:auto-confirm yes;
              set net:timeout 25;
              set net:max-retries 3;
              set net:reconnect-interval-base 5;
              open -u \"$SFTP_USER\",\"$SAFE_PASS\" sftp://$SFTP_HOST:${SFTP_PORT:-2022};
              mirror -R --verbose --no-perms --parallel=4 ${EXCLUDES[*]} ./ /;
              bye
            "
          fi

      - name: Restart the server so the new code runs
        if: steps.cfg.outputs.ready == 'true'
        env:
          PANEL_URL: ${{ vars.PANEL_URL || secrets.PANEL_URL }}
          PANEL_SERVER_ID: ${{ vars.PANEL_SERVER_ID || secrets.PANEL_SERVER_ID }}
          PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
        run: bash .github/scripts/restart-panel.sh
