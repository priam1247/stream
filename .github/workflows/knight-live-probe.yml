name: Temporary real KnightBot source probe
on:
  push:
    branches: [arena/afda50e9-stream]
    paths: ['.github/live-probes/knight-probe.cjs', '.github/workflows/knight-live-probe.yml']
permissions:
  contents: read
jobs:
  real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bot dependencies
        working-directory: Whatsapp bot
        run: npm ci --no-audit --no-fund
      - name: Clone the supplied repository
        run: git clone --depth 1 --quiet https://github.com/mruniquehacker/KnightBot-Mini.git "$RUNNER_TEMP/knightbot"
      - name: Test real upstream functions and fully decode returned media
        env:
          KNIGHT_DIR: ${{ runner.temp }}/knightbot
        run: node .github/live-probes/knight-probe.cjs
