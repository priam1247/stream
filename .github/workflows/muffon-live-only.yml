name: Temporary Muffon Bandcamp live probe
on:
  push:
    branches: [arena/afda50e9-stream]
    paths: ['.github/workflows/muffon-live-only.yml', '.github/live-probes/muffon-bandcamp.rb']
permissions:
  contents: read
jobs:
  bandcamp:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - run: npm ci --no-audit --no-fund
        working-directory: Whatsapp bot
      - run: git clone -q https://github.com/staniel359/muffon-api.git /tmp/muffon-resource && git -C /tmp/muffon-resource checkout -q 8c42827
      - name: Exercise actual Bandcamp service and fully decode a CC BY track
        run: |
          export FFMPEG_PATH="$(cd 'Whatsapp bot' && node -e 'process.stdout.write(require("./utils/ffmpeg")())')"
          ruby .github/live-probes/muffon-bandcamp.rb
