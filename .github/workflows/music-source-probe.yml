name: Temporary music-source probe

on:
  push:
    branches: [arena/0bbc3f9a-stream]

permissions:
  contents: read

jobs:
  audius:
    name: Audius permitted audio
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Search and check creator download permission
        shell: bash
        run: |
          curl -fsSG --max-time 35 -A 'ZaFarBot source verification/1.0' 'https://api.audius.co/v1/tracks/search' \
            --data-urlencode 'query=Tеееest' --data-urlencode 'limit=3' \
            --data-urlencode 'app_name=stream-bot' --data-urlencode 'only_downloadable=1' > "$RUNNER_TEMP/audius.json"
          node -e "const d=require(process.argv[1]);const t=d.data.find(x=>x.id==='xd8gY');if(!t||t.is_downloadable!==true||t.is_download_gated!==false||t.access?.download!==true)process.exit(1)" "$RUNNER_TEMP/audius.json"
      - name: Download through Audius official endpoint
        run: |
          curl -fsSL --max-time 90 --max-filesize 20000000 -A 'ZaFarBot source verification/1.0' 'https://api.audius.co/v1/tracks/xd8gY/download?app_name=stream-bot' -o "$RUNNER_TEMP/audius.mp3"
          [ "$(wc -c < "$RUNNER_TEMP/audius.mp3")" -ge 10240 ]
      - name: Install FFmpeg and FFprobe
        run: |
          npm install --prefix "$RUNNER_TEMP/fftools" --no-save --no-audit --no-fund --ignore-scripts @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
          echo "$RUNNER_TEMP/fftools/node_modules/@ffmpeg-installer/linux-x64" >> "$GITHUB_PATH"
          chmod u+x "$RUNNER_TEMP/fftools/node_modules/@ffprobe-installer/linux-x64/ffprobe"
          echo "$RUNNER_TEMP/fftools/node_modules/@ffprobe-installer/linux-x64" >> "$GITHUB_PATH"
      - name: Check ffmpeg availability
        run: command -v ffmpeg && command -v ffprobe
      - name: Decode complete audio
        run: |
          if ! ffmpeg -v error -i "$RUNNER_TEMP/audius.mp3" -map 0:a:0 -f null - 2> "$RUNNER_TEMP/err"; then
            echo "::error::$(tr '\n' ' ' < "$RUNNER_TEMP/err" | cut -c1-800)"
            exit 1
          fi
      - name: Check expected audio duration
        run: |
          duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$RUNNER_TEMP/audius.mp3")
          echo "$duration" | awk '$1 >= 25 {good=1} END {exit !good}' || { echo "::error::Unexpected duration $duration"; exit 1; }
  commons:
    name: Wikimedia Commons music video
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Search public music videos
        shell: bash
        run: |
          curl -fsSG --max-time 35 -A 'ZaFarBot source verification/1.0' 'https://commons.wikimedia.org/w/api.php' \
            --data-urlencode 'action=query' --data-urlencode 'generator=search' --data-urlencode 'gsrsearch=bach filetype:video' \
            --data-urlencode 'gsrnamespace=6' --data-urlencode 'gsrlimit=5' --data-urlencode 'prop=imageinfo' \
            --data-urlencode 'iiprop=url|size|mime|mediatype|extmetadata' \
            --data-urlencode 'iiextmetadatafilter=ObjectName|Artist|Credit|Attribution|AttributionRequired|LicenseShortName|LicenseUrl|Restrictions|License|Copyrighted' \
            --data-urlencode 'format=json' --data-urlencode 'formatversion=2' > "$RUNNER_TEMP/commons-search.json"
          node -e "const d=require(process.argv[1]);if(!d.query?.pages?.some(p=>p.imageinfo?.[0]?.mediatype==='VIDEO'))process.exit(1)" "$RUNNER_TEMP/commons-search.json"
      - name: Fetch creator and license metadata
        shell: bash
        run: |
          curl -fsSG --max-time 35 -A 'ZaFarBot source verification/1.0' 'https://commons.wikimedia.org/w/api.php' \
            --data-urlencode 'action=query' --data-urlencode 'titles=File:Bach BWV 939.ogv' \
            --data-urlencode 'prop=imageinfo' --data-urlencode 'iiprop=url|size|mime|extmetadata' \
            --data-urlencode 'format=json' --data-urlencode 'formatversion=2' > "$RUNNER_TEMP/commons.json"
          node -e "const p=require(process.argv[1]).query.pages[0];let i=p.imageinfo[0];if(!i.extmetadata.Artist||!i.extmetadata.LicenseShortName||!i.descriptionurl||!i.url.startsWith('https://upload.wikimedia.org/'))process.exit(1)" "$RUNNER_TEMP/commons.json"
      - name: Download Commons file
        run: curl -fsSL --max-time 90 --max-filesize 20000000 -A 'ZaFarBot source verification/1.0' 'https://upload.wikimedia.org/wikipedia/commons/6/60/Bach_BWV_939.ogv' -o "$RUNNER_TEMP/commons.ogv"
      - name: Install FFmpeg and FFprobe
        run: |
          npm install --prefix "$RUNNER_TEMP/fftools" --no-save --no-audit --no-fund --ignore-scripts @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
          echo "$RUNNER_TEMP/fftools/node_modules/@ffmpeg-installer/linux-x64" >> "$GITHUB_PATH"
          chmod u+x "$RUNNER_TEMP/fftools/node_modules/@ffprobe-installer/linux-x64/ffprobe"
          echo "$RUNNER_TEMP/fftools/node_modules/@ffprobe-installer/linux-x64" >> "$GITHUB_PATH"
      - name: Check ffmpeg availability
        run: command -v ffmpeg && command -v ffprobe
      - name: Decode Commons audio
        run: |
          if ! ffmpeg -v error -i "$RUNNER_TEMP/commons.ogv" -map 0:a:0 -f null - 2> "$RUNNER_TEMP/err"; then
            echo "::error::$(tr '\n' ' ' < "$RUNNER_TEMP/err" | cut -c1-800)"
            exit 1
          fi
      - name: Decode Commons video
        run: ffmpeg -v error -i "$RUNNER_TEMP/commons.ogv" -map 0:v:0 -f null -
  dailymotion:
    name: Dailymotion existing video downloader
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install yt-dlp
        run: |
          python3 -m venv "$RUNNER_TEMP/yt"
          "$RUNNER_TEMP/yt/bin/python" -m pip -q install 'yt-dlp==2026.10.26'
      - name: Install FFmpeg and FFprobe
        run: |
          npm install --prefix "$RUNNER_TEMP/fftools" --no-save --no-audit --no-fund --ignore-scripts @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
          echo "$RUNNER_TEMP/fftools/node_modules/@ffmpeg-installer/linux-x64" >> "$GITHUB_PATH"
          chmod u+x "$RUNNER_TEMP/fftools/node_modules/@ffprobe-installer/linux-x64/ffprobe"
          echo "$RUNNER_TEMP/fftools/node_modules/@ffprobe-installer/linux-x64" >> "$GITHUB_PATH"
      - name: Check ffmpeg availability
        run: command -v ffmpeg && command -v ffprobe
      - name: Install newer system FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          echo /usr/bin >> "$GITHUB_PATH"
      - name: Download short video clip with yt-dlp
        run: |
          if ! "$RUNNER_TEMP/yt/bin/yt-dlp" --quiet --no-warnings --no-playlist --no-cache-dir --retries 1 --socket-timeout 20 \
            --download-sections '*0-12' -f 'worst[height<=360]/worst' --merge-output-format mp4 \
            -o "$RUNNER_TEMP/dailymotion.%(ext)s" 'https://www.dailymotion.com/video/x5qmoi5' 2> "$RUNNER_TEMP/err"; then
            error=$(sed -E 's~https?://[^ ]+~[URL]~g' "$RUNNER_TEMP/err" | tr '\n' ' ' | cut -c1-800)
            echo "::error::$error"
            exit 1
          fi
      - name: Decode clip audio and video
        run: |
          file=$(find "$RUNNER_TEMP" -maxdepth 1 -name 'dailymotion.*' ! -name '*.part*' | head -1)
          test -n "$file"
          ffmpeg -v error -i "$file" -map 0:v:0 -map 0:a:0 -f null -
  bot_adapter:
    name: Bot adapter ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source: [audius, commons-audio, commons-video]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bot dependencies
        working-directory: Whatsapp bot
        run: npm ci --omit=optional --no-audit --no-fund
      - name: Install FFmpeg for sample decoding
        run: |
          npm install --prefix "$RUNNER_TEMP/ffmpeg" --no-save --no-audit --no-fund --ignore-scripts @ffmpeg-installer/linux-x64@4.1.0
          chmod u+x "$RUNNER_TEMP/ffmpeg/node_modules/@ffmpeg-installer/linux-x64/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg/node_modules/@ffmpeg-installer/linux-x64" >> "$GITHUB_PATH"
      - name: Check Commons audio adapter download
        if: matrix.source == 'commons-audio'
        working-directory: Whatsapp bot
        run: |
          node -e "const c=require('./utils/commonsMedia').createClient();c.downloadItem(78943371,process.env.RUNNER_TEMP+'/sample.ogg',{kind:'audio',maxBytes:120*1024*1024,maxSeconds:10800}).then(()=>console.log('download passed')).catch(e=>{console.log('::error::download stage '+String(e.code||'UNKNOWN')+' HTTP '+String(e.status||'unknown')+' '+String(e.message||''));process.exitCode=1;})"
      - name: Compare public Commons download status
        if: failure() && matrix.source == 'commons-audio'
        run: |
          sample='https://upload.wikimedia.org/wikipedia/commons/3/3f/Moonlight_Sonata_%28Sharp_c_minor_Sonata%29_2nd_Movement_Beethoven_JMC%2CHan.ogg'
          a=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 -A 'ZaFarBot/2.2 public media' "$sample" || true)
          b=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 -A 'ZaFarBot source verification/1.0' "$sample" || true)
          c=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 -A 'ZaFarBot/2.2 public media' "$sample?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=original" || true)
          echo "::error::Commons sample HTTP statuses: bot=$a curl-probe=$b tracking-query=$c"
      - name: Exercise actual bot search, delivery and full decode
        working-directory: Whatsapp bot
        env:
          PUBLIC_MUSIC_LIVE: '1'
        run: |
          if ! node scripts/test-public-music-live.js '${{ matrix.source }}' > "$RUNNER_TEMP/adapter.log" 2>&1; then
            echo "::error::$(sed -E 's~https?://[^ ]+~[URL]~g' "$RUNNER_TEMP/adapter.log" | tr '\n' ' ' | cut -c1-1200)"
            exit 1
          fi
