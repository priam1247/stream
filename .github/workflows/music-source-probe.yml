name: Temporary music-source probe
on:
  workflow_dispatch:
  push:
    branches: [arena/c505c542-stream]
    paths:
      - .github/workflows/music-source-probe.yml
permissions:
  contents: read
jobs:
  compare-deezer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install bot dependencies
        working-directory: Whatsapp bot
        run: npm ci --no-audit --no-fund
      - name: Get the inspected upstream source
        run: |
          git clone --quiet --depth 1 https://github.com/staniel359/muffon-api.git "$RUNNER_TEMP/muffon-api"
          test "$(git -C "$RUNNER_TEMP/muffon-api" rev-parse HEAD)" = "8c428270d34c2b50e565ef2339ee22a4a1abe9d1"
      - name: Test upstream gateway with anonymous requests
        env:
          MUFFON_CHECKOUT: ${{ runner.temp }}/muffon-api
        run: ruby .github/scripts/muffon-deezer-probe.rb
      - name: Test the bot public API anonymously
        working-directory: Whatsapp bot
        run: |
          node - <<'NODE'
          const { createClient } = require('./utils/deezer');
          const client = createClient({ arl: '' });
          const safe = (err) => [err?.code, err?.stage, err?.status, err?.reason].filter(Boolean).join(' ');
          const notice = (message) => console.log(`::notice title=Anonymous Deezer comparison::${message}`);
          (async () => {
            try { const rows = await client.search('Daft Punk One More Time', { limit: 2 }); notice(`bot public search: response received; results=${rows.length}`); }
            catch (err) { notice(`bot public search: ${safe(err)}`); }
            try { const row = await client.getTrack('3135553'); notice(`bot public metadata: response received; exact_id=${row.id === '3135553'}`); }
            catch (err) { notice(`bot public metadata: ${safe(err)}`); }
          })().catch(() => { console.error('Anonymous probe failed'); process.exitCode = 1; });
          NODE
