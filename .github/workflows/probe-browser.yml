name: probe — can a cloud chromium search Scribd?

# TEMPORARY probe, asked for during the "put the search on chromium" discussion.
# It answers three questions with real numbers from GitHub's own machines:
#   1. does Scribd's /search/query answer a datacenter IP over plain HTTPS?
#   2. does plain HTTPS reach DuckDuckGo / Bing / Mojeek from here? (status only)
#   3. does a real chromium (Playwright) get results where plain HTTPS failed?
# It downloads nothing. Results are written to probe-results.txt on this branch
# (the run logs are not readable from the session, so the job commits them).

on:
  push:
    branches: [arena/3f9eb913-stream]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 1 + 2 · plain HTTPS, no browser
        run: |
          echo "## runner: $(uname -sr) · $(python3 -V) · $(date -u +%FT%TZ)" >> probe-results.txt
          python3 - <<'PY' 2>&1 | tee -a probe-results.txt
          import json, urllib.parse, urllib.request

          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")

          def get(url, accept="application/json, text/html;q=0.9,*/*;q=0.8"):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA, "Accept": accept,
                  "Accept-Language": "en-US,en;q=0.9"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as answer:
                      return answer.status, answer.read()
              except Exception as exc:                      # noqa: BLE001
                  body = b""
                  try:
                      body = exc.read()
                  except Exception:                         # noqa: BLE001
                      pass
                  return getattr(exc, "code", 0), body or repr(exc).encode()

          words = urllib.parse.quote_plus("physics 12th")
          targets = [
              ("scribd /search/query",
               "https://www.scribd.com/search/query?query=" + words
               + "&verbatim=true&ct_lang=0", "json"),
              ("duckduckgo html",
               "https://html.duckduckgo.com/html/?q=site%3Ascribd.com+" + words, "html"),
              ("bing",
               "https://www.bing.com/search?q=site%3Ascribd.com+" + words, "html"),
              ("mojeek",
               "https://www.mojeek.com/search?q=site%3Ascribd.com+" + words, "html"),
          ]
          print("-- plain HTTPS, no browser --")
          for label, url, kind in targets:
              status, body = get(url)
              if kind == "json":
                  try:
                      data = json.loads(body.decode("utf-8", "replace"))
                      docs = (data.get("results", {}).get("documents", {})
                              .get("content", {}).get("documents", []))
                      note = f"{len(docs)} documents"
                      for doc in docs[:3]:
                          note += f" | {doc.get('title', '?')[:40]}"
                  except Exception:                         # noqa: BLE001
                      note = "not json: " + repr(body[:120])
              else:
                  note = (f"{body.count(b'/document/')} '/document/' hits, "
                          f"{len(body)} bytes, starts {repr(body[:60])}")
              print(f"  {label}: HTTP {status} — {note}")
          PY

      - name: 3 · real chromium (Playwright)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium > /tmp/pw.log 2>&1
          echo "-- chromium $(python3 -m playwright --version) --" >> probe-results.txt
          python3 - <<'PY' 2>&1 | tee -a probe-results.txt
          import urllib.parse
          from playwright.sync_api import sync_playwright

          words = "physics 12th"
          targets = [
              ("duckduckgo html",
               "https://html.duckduckgo.com/html/?q="
               + urllib.parse.quote_plus("site:scribd.com " + words)),
              ("bing",
               "https://www.bing.com/search?q="
               + urllib.parse.quote_plus("site:scribd.com " + words)),
              ("scribd search page (js app)",
               "https://www.scribd.com/search?query="
               + urllib.parse.quote_plus(words)),
          ]
          with sync_playwright() as play:
              browser = play.chromium.launch(args=["--no-sandbox",
                                                   "--disable-dev-shm-usage"])
              page = browser.new_page(user_agent=(
                  "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                  "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"))
              for label, url in targets:
                  answers = []
                  page.on("response", lambda r: answers.append(r.status)
                          if r.request.resource_type == "document" else None)
                  try:
                      page.goto(url, wait_until="domcontentloaded", timeout=45000)
                      page.wait_for_timeout(4000)
                      links = page.eval_on_selector_all(
                          "a[href*='/document/']",
                          "els => [...new Set(els.map(e => e.href.split('?')[0]))]")
                      title = page.title()[:70]
                      text = page.inner_text("body")[:160].replace("\n", " ")
                      print(f"  {label}: title={title!r} · "
                            f"{len(links)} document link(s) in the live DOM · "
                            f"http {answers} · text {text!r}")
                      for link in links[:4]:
                          print(f"      {link}")
                  except Exception as exc:                    # noqa: BLE001
                      print(f"  {label}: FAILED — {repr(exc)[:200]}")
                  answers.clear()
              browser.close()
          PY

      - name: publish results to the branch
        if: always()
        run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add probe-results.txt || exit 0
          git diff --cached --quiet && echo "nothing to publish" && exit 0
          git commit -m "probe results [skip ci]"
          git push
