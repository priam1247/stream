name: probe — search engine from a cloud runner, then the panel

# TEMPORARY probe. Second round, no browser this time: chromium was measured
# worse than plain HTTPS on the first round (DuckDuckGo answered plain urllib
# with 8 document links and refused chromium with 403 on the same runner).
# This round asks the only question left: can a cloud runner (a) get real
# document links from DuckDuckGo with plain Python, and (b) reach the panel?
# Nothing is queued on the panel: /health only.

on:
  push:
    branches: [arena/3f9eb913-stream]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: search engine from the runner, and the panel's health
        env:
          PANEL: http://195.123.189.187:25811
        run: |
          python3 - <<'PY' 2>&1 | tee -a probe2-results.txt
          import re, urllib.parse, urllib.request

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")

          def get(url, accept="text/html,application/xhtml+xml,*/*;q=0.8"):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA, "Accept": accept,
                  "Accept-Language": "en-US,en;q=0.9"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as answer:
                      return answer.status, answer.read()
              except Exception as exc:                      # noqa: BLE001
                  body = b""
                  try:
                      body = exc.read()
                  except Exception:                         # noqa: BLE001
                      pass
                  return getattr(exc, "code", 0), body or repr(exc).encode()

          words = urllib.parse.quote_plus("site:scribd.com physics 12th")
          status, body = get("https://html.duckduckgo.com/html/?q=" + words)
          html = body.decode("utf-8", "replace")
          hits = []
          for match in re.finditer(r'class="result__a"[^>]*href="([^"]+)"[^>]*>(.*?)</a>',
                                   html, re.S):
              href = match.group(1)
              inner = urllib.parse.unquote(href)
              target = re.search(r"uddg=([^&]+)", inner)
              url = urllib.parse.unquote(target.group(1)) if target else href
              if "scribd.com/" not in url:
                  continue
              title = re.sub(r"<[^>]+>", "", match.group(2))
              title = " ".join(title.split())[:70]
              if url not in [h[0] for h in hits]:
                  hits.append((url, title))
          print(f"duckduckgo html from the runner: HTTP {status}, "
                f"{len(hits)} scrubbed scribd link(s)")
          for url, title in hits[:6]:
              print(f"  {title}")
              print(f"      {url}")

          panel = "http://195.123.189.187:25811/health"
          status, body = get(panel, accept="*/*")
          print(f"panel /health from the runner: HTTP {status} — {body[:40]!r}")
          PY

      - name: publish results to the branch
        if: always()
        run: |
          git config user.name "probe"
          git config user.email "probe@users.noreply.github.com"
          git add probe2-results.txt || exit 0
          git diff --cached --quiet && echo "nothing to publish" && exit 0
          git commit -m "probe2 results [skip ci]"
          git push
