name: probe3 — does Scribd's search JSON say how many documents there are?
on:
  push:
    branches: [arena/295dc85e-stream]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: inspect the answer
        run: |
          python3 - <<'PY' 2>&1 | tee -a probe3.txt
          import json, urllib.parse, urllib.request
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          def get(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": UA, "Accept": "application/json",
                  "Accept-Language": "en-US,en;q=0.9"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as a:
                      return a.status, a.read()
              except Exception as exc:
                  return getattr(exc, "code", 0), b""
          base = ("https://www.scribd.com/search/query?query="
                  + urllib.parse.quote_plus("excel and succeed") + "&verbatim=true&ct_lang=0")
          for page in (1, 2, 5):
              url = base + ("" if page == 1 else f"&page={page}")
              status, body = get(url)
              print(f"== page {page}: HTTP {status} {len(body)} bytes")
              try:
                  data = json.loads(body.decode("utf-8", "replace"))
              except Exception:
                  print("   not json:", repr(body[:100]))
                  continue
              print("   top-level keys:", sorted(data.keys()))
              for key, value in data.items():
                  if isinstance(value, (int, float, str)) and any(
                          word in key.lower() for word in ("total", "count", "page", "num", "has", "more")):
                      print(f"   {key} = {value!r}")
              docs = (data.get("results", {}).get("documents", {})
                      .get("content", {}).get("documents", []))
              print(f"   documents: {len(docs)}")
              if docs:
                  print("   first:", docs[0].get("title", "?")[:60], "| id", docs[0].get("id"))
                  print("   last :", docs[-1].get("title", "?")[:60], "| id", docs[-1].get("id"))
              res = data.get("results", {}).get("documents", {})
              if isinstance(res, dict):
                  print("   results.documents keys:", sorted(res.keys()))
                  print("   content keys:", sorted((res.get("content") or {}).keys()))
          # what happens past the end?
          status, body = get(base + "&page=400")
          print(f"== page 400: HTTP {status} {len(body)} bytes — {repr(body[:160])}")
          PY
      - name: publish
        if: always()
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe3.txt || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "probe3 results [skip ci]"; git push
