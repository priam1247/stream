name: scribd

# Run a search/download on GitHub's machines, not on yours.
#
# Why: rendering a Scribd document pulls hundreds of page images, fonts and
# scripts. On the runner that traffic costs you nothing — you only download the
# finished PDFs from the run's artifacts.
#
# Setup (once):
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     SCRIBD_COOKIES_B64 = base64 of your cookies.txt
#   (optional: Settings -> General -> Actions -> set the job timeout)
#
# Then: Actions -> scribd -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Search text (ignored when urls is given)"
        required: false
        default: "excel and succeed"
      limit:
        description: "How many documents (0 = everything the search finds)"
        required: false
        default: "5"
      picks:
        description: "Only these result numbers, e.g. 1,3,7 (empty = according to limit)"
        required: false
        default: ""
      pages:
        description: "Search result pages to walk"
        required: false
        default: "5"
      search_only:
        description: "Only list what the search finds (download nothing)"
        type: boolean
        default: false
      urls:
        description: "Document URLs, space or comma separated (skips the search)"
        required: false
        default: ""

concurrency:
  group: scribd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300          # a long batch can take hours; this is the ceiling
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium (with its system libraries)
        run: python -m playwright install --with-deps chromium

      - name: Restore your Scribd cookies (optional)
        env:
          SCRIBD_COOKIES_B64: ${{ secrets.SCRIBD_COOKIES_B64 }}
        run: |
          if [ -n "${SCRIBD_COOKIES_B64:-}" ]; then
            printf '%s' "$SCRIBD_COOKIES_B64" | base64 --decode > cookies.txt
            echo "cookies: $(grep -c . cookies.txt) lines (values not printed)"
          else
            echo "cookies: none supplied — public documents only"
          fi

      - name: Run
        env:
          QUERY: ${{ inputs.query }}
          LIMIT: ${{ inputs.limit }}
          PICKS: ${{ inputs.picks }}
          PAGES: ${{ inputs.pages }}
          URLS: ${{ inputs.urls }}
          SEARCH_ONLY: ${{ inputs.search_only }}
        run: |
          set -euo pipefail
          args=(-o out -f pdf --browser --no-cache --search-pages "${PAGES}")
          if [ -f cookies.txt ]; then
            args+=(--cookies-file cookies.txt)
          fi

          if [ -n "${URLS}" ]; then
            printf '%s' "${URLS}" | tr -s ' ,' '\n\n' | sed '/^$/d' > urls.txt
            echo "mode: urls ($(wc -l < urls.txt) given)"
            args+=(--file urls.txt)
          else
            echo "mode: search '${QUERY}' limit=${LIMIT} pages=${PAGES}"
            args+=(--search "${QUERY}" --limit "${LIMIT}")
            if [ -n "${PICKS}" ]; then
              args+=(--pick "${PICKS}")
            fi
            if [ "${SEARCH_ONLY}" = "true" ]; then
              args+=(--search-only)
            fi
          fi

          echo "command: python -m scribd ${args[*]}"
          python -m scribd "${args[@]}"

      - name: Show what was produced
        if: always()
        run: |
          ls -la out 2>/dev/null || true
          if [ -f out/manifest.jsonl ]; then
            echo "--- manifest ---"
            tail -n 50 out/manifest.jsonl
          fi

      - name: Upload PDFs and the search list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scribd-out-${{ github.run_number }}
          path: |
            out/
            .debug/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0        # PDFs are already compressed
